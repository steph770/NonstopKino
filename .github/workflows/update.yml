name: Programm aktualisieren

on:
  schedule:
    - cron: "17 3,12 * * *"   # zweimal täglich (GitHub startet geplante Läufe oft Stunden später)
  workflow_dispatch:        # "Run workflow" auf GitHub startet es sofort
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "overrides.json"
      - "debug/DUMP"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: programm-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: pip install requests beautifulsoup4 lxml

      - name: Programm holen und Filmdaten ergänzen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scripts/update.py

      - name: Bewertungs-Datenbank prüfen
        if: always()
        run: |
          mkdir -p debug
          url="https://firestore.googleapis.com/v1/projects/nonstopkino-90865/databases/(default)/documents/gruppen/diagnose/x/y?key=AIzaSyBz-Ol6I_BBlX5z3n3cngAPRiJPqvwvclA"
          status=$(curl -sg -o /tmp/fs.json -w "%{http_code}" "$url" || echo 000)
          python3 - "$status" > debug/firestore-check.txt <<'PY'
          import json, sys
          try:
              e = json.load(open("/tmp/fs.json")).get("error", {})
          except Exception:
              e = {}
          print(sys.argv[1], e.get("status", ""), (e.get("message", "") or "")[:200])
          PY
          cat debug/firestore-check.txt

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "nonstopkino-update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          [ -d debug ] && git add debug || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Programm aktualisiert"
            git pull --rebase --autostash
            git push
          fi
